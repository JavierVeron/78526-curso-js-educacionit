<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>APP de Turnos Médicos - Educación IT</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-LN+7fdVzj6u52u30Kp6M/trliBMCMKTyK833zpbD+pXdCLuTusPj697FH4R/5mcr" crossorigin="anonymous">
  </head>
  <body>
    <div class="container-fluid bg-body-tertiary p-3">
        <div class="row">
            <div class="col text-center">
                <a href="index.html">
                    <img src="https://www.osde.com.ar/hubfs/Osde-logo%20ok.png" alt="OSDE" width="150">
                </a>
            </div>
        </div>
    </div>
    <div class="container my-5">
        <form id="formAgregarTurno">
            <div class="row">
                <div class="col-md-4">
                    <label for="nombre" class="form-label">Nombre</label>
                    <input type="text" class="form-control" id="nombre" required>
                </div>
                <div class="col-md-2">
                    <label for="fecha" class="form-label">Fecha</label>
                    <input type="date" class="form-control" id="fecha" required>
                </div>
                <div class="col-md-2">
                    <label for="hora" class="form-label">Hora</label>
                    <input type="time" class="form-control" id="hora" required>
                </div>
                <div class="col-md-3">
                    <label for="especialidad" class="form-label">Especialidad</label>
                    <select id="especialidad" class="form-control">
                        <option value="Cardiología">Cardiología</option>
                        <option value="Dermatología">Dermatología</option>
                        <option value="Neurología">Neurología</option>
                        <option value="Oftalmología">Oftalmología</option>
                        <option value="Pediatría">Pediatría</option>
                        <option value="Traumatología">Traumatología</option>
                        <option value="Urología">Urología</option>
                    </select>
                </div>
                <div class="col-md-1 d-flex justify-content-end align-items-end">
                    <button type="submit" class="btn btn-primary fw-bold" onclick="agregarTurno(event)">Agregar</button>
                </div>
            </div>
        </form>
    </div>
    <div class="container my-5">
        <div class="row">
            <div class="col">
                <table class="table table-striped table-bordered">
                    <thead>
                        <tr>
                            <th scope="col">#</th>
                            <th scope="col">Nombre</th>
                            <th scope="col">Fecha</th>
                            <th scope="col">Hora</th>
                            <th scope="col">Especialidad</th>
                        </tr>
                    </thead>
                    <tbody id="tablaTurnosMedicos"></tbody>
                </table>
            </div>
        </div>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js" integrity="sha384-ndDqU0Gzau9qJ1lfW4pNLlhNTkCfHzAVBReH9diLvGRem5+R9g2FzA8ZGN954O5Q" crossorigin="anonymous"></script>
    <script src="js/index.js"></script>
  </body>
</html>
