<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Clase 3 - Educación IT</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-LN+7fdVzj6u52u30Kp6M/trliBMCMKTyK833zpbD+pXdCLuTusPj697FH4R/5mcr" crossorigin="anonymous">
  </head>
  <body>
    <div class="container">
        <div class="row">
            <div id="origen" class="col bg-light">
                <img id="hamburguesa" src="https://api-middleware-mcd.mcdonaldscupones.com/media/image/product$kqXzqebG/200/200/original?country=ar" alt="Hamburguesa">
            </div>
            <div id="destino" class="col bg-secondary"></div>
        </div>
    </div>
    <div class="container my-3">
        <div class="row">
            <div class="col">
                <form>
                    <div class="mb-3">
                        <label for="email" class="form-label">Email</label>
                        <input type="text" class="form-control" id="email">
                        <div id="emailHelp" class="form-text"></div>
                    </div>
                    <button type="submit" class="btn btn-primary">Enviar</button>
                </form>
            </div>
        </div>
    </div>
    <div class="container my-3">
        <div class="row">
            <div class="col">
                <form id="miFormulario" method="post" action="https://www.google.com/search" >
                    <div class="mb-3">
                        <label for="exampleInputEmail1" class="form-label">Texto</label>
                        <input type="text" class="form-control" id="q" name="q" aria-describedby="emailHelp">
                    </div>
                    <button type="submit" class="btn btn-primary" onclick="validacionFormulario(event)">Submit</button>
                    <button type="reset" class="btn btn-primary">Reset</button>
                </form>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js" integrity="sha384-ndDqU0Gzau9qJ1lfW4pNLlhNTkCfHzAVBReH9diLvGRem5+R9g2FzA8ZGN954O5Q" crossorigin="anonymous"></script>
    <script src="js/index.js"></script>
  </body>
</html>
