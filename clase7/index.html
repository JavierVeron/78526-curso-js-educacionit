<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Clase 7 - Educación IT</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-LN+7fdVzj6u52u30Kp6M/trliBMCMKTyK833zpbD+pXdCLuTusPj697FH4R/5mcr" crossorigin="anonymous">
  </head>
  <body>
    <div class="container my-5">
      <div id="contenido" class="row">
        <div class="col">
          <p id="parrafo"></p>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js" integrity="sha384-ndDqU0Gzau9qJ1lfW4pNLlhNTkCfHzAVBReH9diLvGRem5+R9g2FzA8ZGN954O5Q" crossorigin="anonymous"></script>
    <script src="js/index2.js"></script>
    <!-- Include Handlebars from a CDN -->
    <script src="https://cdn.jsdelivr.net/npm/handlebars@latest/dist/handlebars.js"></script>
    <!-- <script>
    // compile the template
    var template = Handlebars.compile("Handlebars <b>{{doesWhat}}</b>");
    // execute the compiled template and print the output to the console
    console.log(template({ doesWhat: "rocks!" }));
    </script> -->
    <script id="template" type="text/x-handlebars-template">
      <h2>{{titulo}}</h2>
      <p>{{descripcion}}</p>
    </script>
    <script>
      // Obtener el HTML de la plantilla
      const templateSource = document.getElementById("template").innerHTML;
      // Compilar la plantilla con Handlebars
      const template = Handlebars.compile(templateSource);
      // Datos dinámicos
      const contexto = {
        titulo: "Bienvenidos a Handlebars",
        descripcion: "Renderizado dinámico de contenido en JavaScript."
      };
      // Generar HTML con datos y agregarlo al DOM
      document.body.innerHTML += template(contexto);
    </script>
  </body>
</html>
